# Autenticación vía DecapBridge (reemplaza a Netlify Identity, que Netlify está retirando)
backend:
  name: git-gateway
  repo: estevan-car/serena
  branch: main
  identity_url: https://auth.decapbridge.com/sites/e40979d1-2fc4-4d7a-8ab1-656932978969
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://serenapastelapp.netlify.app

# Sube fotos nuevas aquí. Las fotos ya existentes en recursos/imagenes/ no se mueven.
media_folder: "recursos/imagenes/uploads"
public_folder: "recursos/imagenes/uploads"

locale: "es"

collections:
  - name: "catalogo"
    label: "Catálogo de diseños"
    files:
      - name: "15-anios"
        label: "15 Años"
        file: "data/15-anios.json"
        fields:
          - label: "Encabezado de la página"
            name: "hero"
            widget: "object"
            collapsed: true
            fields:
              - {label: "Etiqueta (arriba del título)", name: "etiqueta", widget: "string"}
              - {label: "Título", name: "titulo", widget: "string"}
              - {label: "Descripción", name: "descripcion", widget: "text"}
              - {label: "Imagen principal", name: "imagen", widget: "image", choose_url: false}
          - label: "Diseños del catálogo"
            name: "disenos"
            widget: "list"
            summary: "{{fields.nombre}} — {{fields.precio}}"
            fields:
              - {label: "Nombre del diseño", name: "nombre", widget: "string"}
              - {label: "Etiquetas (ej. Rosas • Dorado • Perlas)", name: "tags", widget: "string"}
              - {label: "Precio (COP)", name: "precio", widget: "number", value_type: "int", min: 0}
              - {label: "Foto", name: "imagen", widget: "image", choose_url: false}

